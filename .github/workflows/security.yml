name: Segurança

# A cada push/PR e toda segunda-feira: auditoria de dependências (CVEs
# conhecidos), checagem de tipos e build, e análise estática com CodeQL.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Auditoria de dependências (falha em CVE alto ou crítico)
        run: npm audit --audit-level=high
      - name: Assinaturas dos pacotes (proveniência do registro npm)
        run: npm audit signatures
      - name: Tipos e build
        run: npm run build

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
