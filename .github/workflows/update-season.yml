name: Atualizar temporada

# Roda 2x por dia (09:00 e 21:00 UTC = 06:00 e 18:00 em Brasília).
# Custo zero além da assinatura do Claude (secret CLAUDE_CODE_OAUTH_TOKEN).
#
# Segurança — três jobs isolados:
#  1. collect: lê fontes públicas. Sem segredos, só leitura do repositório.
#  2. extract: o Claude roda numa pasta VAZIA contendo apenas .bot/ (sem o
#     repositório, sem .git, sem credenciais do GitHub), sem terminal e sem
#     internet. Antes de qualquer upload, o resultado passa por varredura de
#     credenciais. É o único job com o token do Claude.
#  3. apply: valida (schema estrito, limites, varredura de credenciais) e
#     publica. Nunca vê o token do Claude.
# Todas as Actions são fixadas por hash de commit (proteção contra tags
# adulteradas, como no ataque à tj-actions/changed-files, CVE-2025-30066).
on:
  schedule:
    - cron: '0 9,21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Acionar a extração mesmo antes da data prevista do próximo episódio'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-season
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pending: ${{ steps.pending.outputs.open }}
      needs_extraction: ${{ steps.collect.outputs.needs_extraction }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enquanto houver uma revisão pendente, não reprocessa o mesmo episódio
      - name: Verificar revisão pendente
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("bot/"))] | length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "::notice::Há $open PR(s) de revisão do robô aberto(s); aguardando merge."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pending.outputs.open == '0'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (sem scripts de instalação)
        if: steps.pending.outputs.open == '0'
        run: npm ci --ignore-scripts

      - name: Coletar fotos e matérias
        id: collect
        if: steps.pending.outputs.open == '0'
        run: npx tsx scripts/collect.ts ${{ inputs.force && '--force' || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.pending.outputs.open == '0'
        with:
          name: contexto
          path: .bot/
          include-hidden-files: true
          retention-days: 1

  extract:
    needs: collect
    if: needs.collect.outputs.needs_extraction == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Sem checkout: a pasta de trabalho contém só as matérias e as instruções
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contexto
          path: .bot

      - name: Extrair episódios (Claude Code, assinatura)
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: 'Siga as instruções em .bot/instructions.md'
          # Só lê .bot/ e só escreve .bot/extracted.json: sem terminal, sem internet
          claude_args: >-
            --max-turns 15
            --allowedTools "Read(./.bot/**),Write(./.bot/extracted.json),Edit(./.bot/extracted.json)"
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,Task,Read(~/.claude/**),Read(~/.config/**),Read(//proc/**),Read(//etc/**),Read(//tmp/**)"

      # Se uma injeção de prompt tentar vazar algo, o arquivo nem sai deste job
      - name: Varredura de credenciais antes do upload
        run: |
          f=.bot/extracted.json
          [ -f "$f" ] || { echo "::error::extracted.json não foi gerado"; exit 1; }
          [ "$(stat -c%s "$f")" -le 200000 ] || { echo "::error::extracted.json grande demais"; exit 1; }
          if grep -qE 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|eyJ[A-Za-z0-9_-]{10,}\.|BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}' "$f"; then
            echo "::error::Possível credencial na extração; arquivo descartado."
            rm -f "$f"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extracao
          path: .bot/extracted.json
          retention-days: 1

  apply:
    needs: [collect, extract]
    # Roda mesmo sem extração (para atualizar fotos), mas nunca se a extração falhou
    if: always() && needs.collect.result == 'success' && needs.collect.outputs.pending == '0' && needs.extract.result != 'failure' && needs.extract.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (sem scripts de instalação)
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contexto
          path: .bot

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.extract.result == 'success'
        with:
          name: extracao
          path: .bot

      - name: Validar e aplicar
        id: apply
        run: npx tsx scripts/apply.ts

      - name: Conferir se o site ainda compila
        if: steps.apply.outputs.status == 'publish' || steps.apply.outputs.status == 'review'
        run: npm run build

      - name: Publicar (commit direto na main)
        if: steps.apply.outputs.status == 'publish'
        env:
          SUMMARY: ${{ steps.apply.outputs.summary }}
          REPORT: ${{ steps.apply.outputs.report }}
        run: |
          git config user.name "masterchef-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet && exit 0
          printf 'dados: atualização automática\n\n%s\n\n%s\n' "$SUMMARY" "$REPORT" > "$RUNNER_TEMP/msg.txt"
          git commit -F "$RUNNER_TEMP/msg.txt"
          git push

      - name: Abrir PR para revisão
        if: steps.apply.outputs.status == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.apply.outputs.summary }}
          REPORT: ${{ steps.apply.outputs.report }}
        run: |
          branch="bot/atualizacao-$(date -u +%Y%m%d-%H%M)"
          git config user.name "masterchef-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data
          git commit -m "dados: atualização automática (requer revisão)"
          git push -u origin "$branch"
          {
            echo "O robô encontrou novidades, mas alguma validação pediu revisão humana."
            echo "Confira os pontos abaixo, ajuste \`src/data/episodes.json\` nesta branch se necessário e faça o merge."
            echo
            echo "$SUMMARY"
            echo
            echo "$REPORT"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --title "Atualização automática: revisar episódio" --body-file "$RUNNER_TEMP/body.md"
